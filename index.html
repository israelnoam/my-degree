<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>התואר שלי</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.anthropic.com https://*.googleapis.com https://accounts.google.com https://sap.cheesefork.cf; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="התואר שלי">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css?v=16">
  <link rel="stylesheet" href="extras.css?v=16">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="34" height="34">
      <span>התואר שלי</span>
    </div>
    <div class="stats" id="stats"></div>
    <button class="sync-btn" id="syncBtn" type="button" title="סנכרון עם Google">
      <span class="dot"></span><span class="label">לא מסונכרן</span>
    </button>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="map"><span>🎓</span>מפת קורסים</button>
    <button data-view="planner"><span>🎯</span>תכנון תואר</button>
    <button data-view="tasks"><span>📝</span>משימות</button>
    <button data-view="timetable"><span>🕒</span>מערכת שעות</button>
    <button data-view="cv"><span>📄</span>קו״ח</button>
  </nav>

  <main id="view"></main>

  <dialog id="modal">
    <form method="dialog" id="modalForm"></form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <input type="file" id="importFile" hidden>
  <input type="file" id="gradeFile" hidden>

  <script src="data.js?v=16"></script>
  <script src="store.js?v=16"></script>
  <script src="catalog.js?v=16"></script>
  <script src="app.js?v=16"></script>
  <script src="google.js?v=16"></script>
  <script src="grades.js?v=16"></script>
  <script src="cheesefork.js?v=16"></script>
  <script src="planner.js?v=16"></script>
  <script src="stats.js?v=16"></script>
  <script src="cv.js?v=16"></script>
  <script src="extras.js?v=16"></script>
</body>
</html>
